name: Terraform main

on:
  push:
    branches: [main, master]
    paths:
      - "stacks/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/actions/setup-terraform-aws/**"
  workflow_dispatch:
    inputs:
      stacks:
        description: "Comma-separated stacks to run (empty = all)"
        required: false
        default: ""

concurrency:
  group: tf-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.set.outputs.stacks }}
      any: ${{ steps.set.outputs.any }}
      apply_order: ${{ steps.set.outputs.apply_order }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' || inputs.stacks == ''
        with:
          filters: |
            iam:
              - 'stacks/iam/**'
            s3:
              - 'stacks/s3/**'
            network:
              - 'stacks/network/**'
            netbird-network:
              - 'stacks/netbird-network/**'
            ec2:
              - 'stacks/ec2/**'
            rds:
              - 'stacks/rds/**'

      - name: Build matrix + apply order
        id: set
        shell: bash
        run: |
          order=(iam s3 network netbird-network ec2 rds)
          stacks=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.stacks }}" ]]; then
            IFS=',' read -ra raw <<< "${{ inputs.stacks }}"
            for s in "${raw[@]}"; do
              s=$(echo "$s" | xargs)
              [[ -n "$s" ]] && stacks+=("$s")
            done
          else
            [[ "${{ steps.filter.outputs.iam }}" == "true" ]] && stacks+=("iam")
            [[ "${{ steps.filter.outputs.s3 }}" == "true" ]] && stacks+=("s3")
            [[ "${{ steps.filter.outputs.network }}" == "true" ]] && stacks+=("network")
            [[ "${{ steps.filter.outputs.netbird-network }}" == "true" ]] && stacks+=("netbird-network")
            [[ "${{ steps.filter.outputs.ec2 }}" == "true" ]] && stacks+=("ec2")
            [[ "${{ steps.filter.outputs.rds }}" == "true" ]] && stacks+=("rds")
          fi

          if [[ ${#stacks[@]} -eq 0 ]]; then
            echo 'stacks=[]' >> "$GITHUB_OUTPUT"
            echo 'apply_order=[]' >> "$GITHUB_OUTPUT"
            echo 'any=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${stacks[@]}" | jq -R . | jq -sc .)
          echo "stacks=${json}" >> "$GITHUB_OUTPUT"
          echo 'any=true' >> "$GITHUB_OUTPUT"

          # Preserve dependency order for apply
          ordered=()
          for s in "${order[@]}"; do
            for c in "${stacks[@]}"; do
              [[ "$c" == "$s" ]] && ordered+=("$s")
            done
          done
          order_json=$(printf '%s\n' "${ordered[@]}" | jq -R . | jq -sc .)
          echo "apply_order=${order_json}" >> "$GITHUB_OUTPUT"
          echo "Changed: ${stacks[*]}"
          echo "Apply order: ${ordered[*]}"

  checks:
    name: Check ${{ matrix.stack }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    defaults:
      run:
        working-directory: stacks/${{ matrix.stack }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_netbird_token: ${{ secrets.NETBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform + AWS
        uses: ./.github/actions/setup-terraform-aws
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend) + validate
        run: |
          terraform init -backend=false -upgrade
          terraform validate

      - name: init (remote state)
        run: terraform init -upgrade

      - name: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan | tee plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-main-${{ matrix.stack }}
          path: |
            stacks/${{ matrix.stack }}/tfplan
            stacks/${{ matrix.stack }}/plan.txt
          retention-days: 7

  apply:
    name: Apply (manual approval)
    needs: [detect, checks]
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_netbird_token: ${{ secrets.NETBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform + AWS
        uses: ./.github/actions/setup-terraform-aws
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Apply changed stacks in dependency order
        shell: bash
        run: |
          set -euo pipefail
          order='${{ needs.detect.outputs.apply_order }}'
          echo "Apply order: ${order}"
          echo "$order" | jq -r '.[]' | while read -r stack; do
            echo "===== APPLY ${stack} ====="
            cd "stacks/${stack}"
            terraform init -upgrade
            terraform plan -input=false -out=tfplan
            terraform apply -input=false -auto-approve tfplan
            cd - >/dev/null
          done
